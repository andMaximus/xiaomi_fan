fan_set_buzzer:
  name: Set buzzer
  description: Turn the buzzer on or off.
  fields:
    entity_id:
      name: Entity ID
      description: Name of the Xiaomi Mi Smart Fan entity.
      selector:
        entity:
          integration: xiaomi_miio_fan
          domain: fan
    enabled:
      name: Enabled
      description: True to turn the buzzer on, false to turn it off.
      example: true
      selector:
        boolean:

fan_set_child_lock:
  name: Set child lock
